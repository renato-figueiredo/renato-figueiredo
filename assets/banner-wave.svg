<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="280" viewBox="0 0 1200 280">
<style>
.w{animation:wv linear infinite}.w1{animation-duration:14s}.w2{animation-duration:10s;animation-direction:reverse}.w3{animation-duration:7s}
@keyframes wv{to{transform:translateX(-600px)}}
.f{opacity:0;animation:fi .8s ease-out forwards}.f2{animation-delay:.25s}.f3{animation-delay:.5s}
@keyframes fi{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}.f{opacity:1}
</style>
<defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0d1117"/><stop offset="1" stop-color="#0f2a1a"/></linearGradient><clipPath id="c"><rect width="1200" height="280" rx="14"/></clipPath></defs>
<g clip-path="url(#c)"><rect width="1200" height="280" fill="url(#g)"/>
<path class="w w1" fill="#238636" fill-opacity="0.25" d="M0 200 Q150 160 300 200 T600 200 T900 200 T1200 200 T1500 200 T1800 200 V300 H0Z"/>
<path class="w w2" fill="#2ea043" fill-opacity="0.3" d="M0 222 Q150 182 300 222 T600 222 T900 222 T1200 222 T1500 222 T1800 222 V300 H0Z"/>
<path class="w w3" fill="#3fb950" fill-opacity="0.45" d="M0 246 Q150 206 300 246 T600 246 T900 246 T1200 246 T1500 246 T1800 246 V300 H0Z"/>
<text class="f" x="70" y="110" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="56" font-weight="700" fill="#e6edf3">Renato Figueiredo</text>
<text class="f f2" x="72" y="155" font-family="Segoe UI,Helvetica,Arial,sans-serif" font-size="24" fill="#3fb950">Desenvolvedor Web · Soluções Tecnológicas</text>
<text class="f f3" x="72" y="190" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="18" fill="#8b949e">JavaScript · Vue · React · Node.js</text></g>
<rect x=".5" y=".5" width="1199" height="279" rx="14" fill="none" stroke="#30363d"/>
</svg>
